<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Room Settings</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div style="margin-bottom: 24px;">
            <a href="home.html" style="text-decoration: none; color: var(--text-sub); font-size: 14px;">&lt; 뒤로가기</a>
            <h2>방 설정</h2>
        </div>

        <div class="card">

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 20px; font-weight: 700; letter-spacing: 1px;">A1B2-C3D4</span>
                <button style="padding: 8px 16px; border-radius: 8px; border: none; background: #E5E8EB; font-weight: 600; cursor: pointer;">복사</button>

        </div>

        <h3 style="font-size: 15px; color: var(--text-sub); margin-top: 40px; margin-bottom: 8px;">위험 구역</h3>
        <div class="card" style="border: 1px solid #FFE4E4; background: #FFF5F5;">
            <h3 style="font-size: 16px; font-weight: 700; color: var(--danger);">대결 그만두기</h3>
            <p style="margin-bottom: 16px; font-size: 13px;">나가면 쌓은 점수가 모두 사라집니다.</p>
            <a href="#" style="color: var(--danger); font-weight: 600; font-size: 14px;">방 나가기 &gt;</a>
