<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piggy Bank - Dashboard</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="nav">
        <span id="user-greeting">Loading...</span>
        
        <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--green);">
            <div style="width: 8px; height: 8px; background: var(--green); border-radius: 50%;"></div>
            Connected
        </div>
    </header>

    <div class="container">
        <div id="hero-section">
            </div>

        <h3>My Active Rooms</h3>
        <div id="room-list">
            </div>
    </div>

    <button class="fab" onclick="app.goTo('create-room.html')">
        +
    </button>

    <script src="js/global.js"></script>

    <script>
        // Check if user is logged in
        const user = app.checkAuth();
        
        // Init Dashboard
        window.onload = () => {
            renderHeader();
            renderDashboard();
        };

        function renderHeader() {
            // Display User Name
            document.getElementById('user-greeting').textContent = `Hello, ${user} 👋`;
        }

        function renderDashboard() {
            // Load rooms from LocalStorage
            const rooms = app.db.load('rooms') || [];
            const heroSection = document.getElementById('hero-section');
            const roomList = document.getElementById('room-list');

            // Clear previous content
            heroSection.innerHTML = '';
            roomList.innerHTML = '';

            // [Scenario A] No Rooms (Empty State)
            if (rooms.length === 0) {
                renderEmptyState(heroSection, roomList);
                return;
            }

            // [Scenario B] Has Rooms
            // 1. Render Hero Card (First room is treated as Primary)
            const primaryRoom = rooms[0]; 
            renderHeroCard(heroSection, primaryRoom);

            // 2. Render List (All rooms)
            rooms.forEach(room => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => {
                    // Save selected room ID to know which details to show next
                    app.db.save('currentRoomId', room.id);
                    app.goTo('routine.html'); // We will build this page next
                };

                // Determine Status Color/Icon
                const statusIcon = room.isDone ? '🟢' : '🔴';
                const statusText = room.isDone ? 'Done' : 'Behind';

                item.innerHTML = `
                    <div>
                        <div style="font-weight: 700; font-size: 16px; margin-bottom: 4px;">
                            ${room.name}
                        </div>
                        <div style="font-size: 13px; color: var(--grey);">
                            ${room.type === 'routine' ? 'Routine Challenge' : 'Daily To-do'}
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-weight: 700; color: var(--primary); margin-bottom: 4px;">
                            ${room.points} pts
                        </div>
                        <div style="font-size: 12px; color: var(--grey);">
                            ${statusIcon} ${statusText}
                        </div>
                    </div>
                `;
                roomList.appendChild(item);
            });
        }

        // Helper: Render Empty State
        function renderEmptyState(heroTarget, listTarget) {
            heroTarget.innerHTML = `
                <div class="card" style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 40px; margin-bottom: 16px;">📭</div>
                    <h2>No active rooms</h2>
                    <p>Join a competition or create one to start your routine!</p>
                </div>
            `;
            listTarget.innerHTML = `
                <p style="text-align: center; margin-top: 40px; opacity: 0.5;">
                    Tap the + button to create a room.
                </p>
            `;
        }

        // Helper: Render Hero Card
        function renderHeroCard(target, room) {
            // Dynamic Style based on status
            // If done: Green/Blue Gradient. If not: Red/Orange warning (Optional logic)
            // For now, we use the standard Blue Hero style.
            
            const isDone = room.isDone || false;
            const statusMsg = isDone 
                ? "You are winning! Keep it up. 🏆" 
                : "Complete your mission to turn the light Green! 🚨";

            target.innerHTML = `
                <div class="hero-card" onclick="app.db.save('currentRoomId', ${room.id}); app.goTo('routine.html')">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <div style="background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700;">
                            🔥 DAY 1
                        </div>
                        <div style="font-weight: 800; font-size: 14px; opacity: 0.9;">
                            1st Place
                        </div>
                    </div>
                    
                    <h2 style="font-size: 24px; margin-bottom: 8px;">${room.name}</h2>
                    <p style="color: rgba(255,255,255,0.9); font-size: 14px;">
                        ${statusMsg}
                    </p>
                    
                    <button class="btn-white" style="
                        background: rgba(255,255,255,0.2); 
                        border: 1px solid rgba(255,255,255,0.4); 
                        color: white; 
                        padding: 10px 20px; 
                        border-radius: 20px; 
                        font-weight: 600; 
                        margin-top: 16px; 
                        cursor: pointer;">
                        ${isDone ? 'View Status' : 'Upload Proof'}
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
