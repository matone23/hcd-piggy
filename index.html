<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piggy Bank Competition - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="center-content">
        <div class="icon-lg">🐷</div>
        <h1>Make your<br>routine stick.</h1>
        <p>Competition that works.</p>

        <div class="input-group" style="width: 100%; max-width: 320px; margin-top: 40px;">
            <input id="input-nickname" type="text" placeholder="Enter Nickname" autocomplete="off" style="text-align: center; font-weight: 600;">
        </div>

        <button id="start-btn" class="btn-primary">Start Now</button>

        <p style="font-size: 13px; margin-top: 24px; opacity: 0.6;">
            No sign-up required. Just jump in.
        </p>
    </div>

    <script src="js/global.js"></script>
    <script>
        (() => {
            const input = document.getElementById('input-nickname');
            const startBtn = document.getElementById('start-btn');

            // Prefill if user exists
            const savedUser = app.db.load('user');
            if (savedUser) {
                input.value = savedUser;
            }

            const handleLogin = () => {
                const nickname = input.value.trim();
                if (!nickname) {
                    app.toast('Please enter a nickname! 🥺');
                    input.focus();
                    return;
                }

                app.db.save('user', nickname);
                app.toast(`Welcome, ${nickname}! 👋`);

                setTimeout(() => app.goTo('dashboard.html'), 400);
            };

            startBtn.addEventListener('click', handleLogin);
            input.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') handleLogin();
            });
        })();
    </script>
</body>
</html>
