<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Piggy Habit | Create Room</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">
    <main class="page">
        <header class="between flex">
            <div>
                <div class="muted">Create Room</div>
                <div style="font-weight: 800; font-size: 22px;">Set the battleground</div>
            </div>
            <button class="btn btn-outline btn-small" onclick="window.location.href='lobby.html'">Back</button>
        </header>

        <section class="card stack mt-24">
            <div class="input-group">
                <label for="room-name">Room Name</label>
                <input id="room-name" type="text" maxlength="30" placeholder="e.g. Screen-free mornings">
            </div>

            <div class="input-group">
                <label>Mode</label>
                <div class="chips" id="mode-chips">
                    <div class="chip active" data-mode="routine">Type A · Routine</div>
                    <div class="chip" data-mode="oneday">Type B · 1-Day</div>
                </div>
            </div>

            <div id="routine-options" class="stack">
                <div class="input-group">
                    <label>Duration</label>
                    <div class="chips" id="duration-chips">
                        <div class="chip active" data-days="3">3 days</div>
                        <div class="chip" data-days="7">7 days</div>
                        <div class="chip" data-days="14">14 days</div>
                    </div>
                </div>
            </div>

            <div id="oneday-options" class="stack" style="display:none;">
                <div class="input-group">
                    <label for="dday">Pick D-Day</label>
                    <input id="dday" type="date">
                </div>
            </div>

            <button id="nextBtn" class="btn btn-primary">Next: Pledge</button>
        </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDA2c4ppqojUpSi090q7jyXSLR_8GTCXIw",
            authDomain: "hcd-piggy.firebaseapp.com",
            databaseURL: "https://hcd-piggy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hcd-piggy",
            storageBucket: "hcd-piggy.firebasestorage.app",
            messagingSenderId: "663289864346",
            appId: "1:663289864346:web:8eba034298e5681d7b3f23"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const database = getDatabase(app);
        
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseDatabase = database;
        window.firebaseApp = app;
    </script>
    
    
    <script type="module">
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Create page DOM loaded');
            
            // Load app module
            let app;
            try {
                const appModule = await import('./js/app.js');
                app = appModule.default;
                
                // Initialize Firebase
                await app.initializeFirebase();
                console.log('Firebase ready in create page:', app.isFirebaseReady());
            } catch (error) {
                console.error('Failed to load app module:', error);
                return;
            }

            const user = app.requireUser();
            const modeChips = document.querySelectorAll('#mode-chips .chip');
            const durationChips = document.querySelectorAll('#duration-chips .chip');
            const routineOptions = document.getElementById('routine-options');
            const onedayOptions = document.getElementById('oneday-options');
            const nextBtn = document.getElementById('nextBtn');
            const roomName = document.getElementById('room-name');
            const dday = document.getElementById('dday');

            console.log('Elements found:', { modeChips, durationChips, nextBtn, roomName });

            if (dday) {
                dday.valueAsDate = new Date();
            }

            let formState = {
                mode: 'routine',
                duration: 3,
                dday: dday?.value || new Date().toISOString().split('T')[0]
            };

            console.log('Initial form state:', formState);

            const setActive = (nodeList, target) => {
                nodeList.forEach(el => el.classList.toggle('active', el === target));
            };

            modeChips.forEach(chip => {
                chip.addEventListener('click', () => {
                    console.log('Mode chip clicked:', chip.dataset.mode);
                    formState.mode = chip.dataset.mode;
                    setActive(modeChips, chip);
                    if (formState.mode === 'routine') {
                        if (routineOptions) routineOptions.style.display = 'block';
                        if (onedayOptions) onedayOptions.style.display = 'none';
                    } else {
                        if (routineOptions) routineOptions.style.display = 'none';
                        if (onedayOptions) onedayOptions.style.display = 'block';
                    }
                });
            });

            durationChips.forEach(chip => {
                chip.addEventListener('click', () => {
                    console.log('Duration chip clicked:', chip.dataset.days);
                    formState.duration = Number(chip.dataset.days);
                    setActive(durationChips, chip);
                });
            });

            if (dday) {
                dday.addEventListener('change', () => {
                    formState.dday = dday.value;
                    console.log('D-day changed:', formState.dday);
                });
            }

            nextBtn?.addEventListener('click', async () => {
                console.log('Next button clicked');
                const name = roomName?.value?.trim();
                if (!name) {
                    app.showToast('Enter a room name.');
                    roomName?.focus();
                    return;
                }

                try {
                    nextBtn.disabled = true;
                    nextBtn.textContent = 'Creating Room...';
                    
                    const roomData = {
                        name,
                        description: `${formState.mode} room for ${formState.duration} days`,
                        mode: formState.mode,
                        duration: formState.duration,
                        dday: formState.dday,
                        owner: user.nickname
                    };

                    console.log('Creating room with data:', roomData);
                    
                    // Create room using Firebase
                    const room = await app.createRoom(roomData);
                    console.log('Room created:', room);
                    
                    app.showToast(`Room "${name}" created! Code: ${room.code || room.id}`);
                    
                    // Show room code in console for easy copying
                    console.log('🎉 ROOM CREATED! Share this code:', room.code || room.id);
                    
                    // Save draft for onboarding
                    const draft = {
                        id: room.id,
                        code: room.code || room.id,
                        owner: user.nickname,
                        name,
                        mode: formState.mode,
                        duration: formState.duration,
                        dday: formState.dday || dday?.value
                    };
                    
                    localStorage.setItem('piggy-habit-draft', JSON.stringify(draft));
                    
                    setTimeout(() => {
                        window.location.href = `onboarding.html?type=${formState.mode}`;
                    }, 500);
                } catch (error) {
                    console.error('Error creating room:', error);
                    app.showToast('Failed to create room. Please try again.');
                } finally {
                    nextBtn.disabled = false;
                    nextBtn.textContent = 'Next: Pledge';
                }
            });

            console.log('Create page initialized successfully');
        });
    </script>
</body>
</html>
