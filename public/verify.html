<body class="app-shell">

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDA2c4ppqojUpSi090q7jyXSLR_8GTCXIw",
            authDomain: "hcd-piggy.firebaseapp.com",
            databaseURL: "https://hcd-piggy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hcd-piggy",
            storageBucket: "hcd-piggy.firebasestorage.app",
            messagingSenderId: "663289864346",
            appId: "1:663289864346:web:8eba034298e5681d7b3f23"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const database = getDatabase(app);
        
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseDatabase = database;
        window.firebaseApp = app;
    </script>
    
    <script type="module">
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Verify page DOM loaded');
            
            // Load app module
            let app;
            try {
                const appModule = await import('./js/app.js');
                app = appModule.default;
                
                // Initialize Firebase
                await app.initializeFirebase();
                console.log('Firebase ready in verify:', app.isFirebaseReady());
            } catch (error) {
                console.error('Failed to load app module:', error);
                return;
            }

            const user = app.requireUser();
            const proof = JSON.parse(localStorage.getItem('piggy-habit-proof') || '{}');
            const imgData = localStorage.getItem('piggy-habit-proof-img');
            console.log('Verify data:', { proof, hasImage: !!imgData });
            
            const previewImg = document.getElementById('previewImg');
            const taskLabel = document.getElementById('taskLabel');
            const submitBtn = document.getElementById('submitBtn');

            console.log('Elements found:', { previewImg, taskLabel, submitBtn });

            if (taskLabel) {
                taskLabel.textContent = proof.task ? `${proof.task.label || 'Task'} · ${proof.task.desc || ''}` : 'Task';
            }
            if (previewImg) {
                previewImg.src = imgData || '';
            }

            submitBtn?.addEventListener('click', async () => {
                console.log('Submit button clicked');
                
                if (!imgData) {
                    app.showToast('No photo attached.');
                    return;
                }
                
                try {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Submitting...';
                    
                    // Submit proof to Firebase if available
                    if (app.isFirebaseReady() && proof.roomId) {
                        try {
                            const proofData = {
                                userId: user.id,
                                task: proof.task,
                                imageData: imgData,
                                timestamp: Date.now(),
                                roomId: proof.roomId
                            };
                            
                            console.log('Submitting proof to Firebase:', proofData);
                            // Note: In a real app, you'd upload the image to Firebase Storage
                            // and save metadata to Realtime Database
                        } catch (error) {
                            console.warn('Failed to submit to Firebase, continuing locally:', error);
                        }
                    }
                    
                    app.showToast('Proof submitted!');
                    setTimeout(() => {
                        localStorage.removeItem('piggy-habit-proof-img');
                        // mark completion for room to consume
                        localStorage.setItem('piggy-habit-proof-done', JSON.stringify(proof));
                        window.location.href = 'room.html';
                    }, 500);
                } catch (error) {
                    console.error('Error submitting proof:', error);
                    app.showToast('Failed to submit proof. Please try again.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Proof';
                }
            });
            
            console.log('Verify page initialized successfully');
        });
    </script>
    </script>
</body>
</html>
