<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Piggy Habit | Lobby</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">
    <main class="page">
        <header class="between flex">
            <div>
                <div id="greeting" style="font-weight: 800; font-size: 22px;"></div>
            </div>
            <button class="btn btn-outline btn-small" id="logoutBtn">Logout</button>
        </header>

        <!-- Loading overlay - shown while data loads -->
        <div id="lobbyLoadingOverlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f1115; z-index: 9999; display: flex; align-items: center; justify-content: center;">
            <div class="card stack" style="text-align: center; max-width: 300px;">
                <div class="muted">Loading lobby...</div>
                <div style="padding: 20px;">
                    <div style="font-size: 32px; animation: spin 1s linear infinite;">🐷</div>
                </div>
            </div>
        </div>

        <section class="stack mt-24" id="lobbyContent">
            <div id="oldCompetitionsSection" style="display: none;">
                <div id="oldCompetitionsContainer"></div>
            </div>
            
            <div class="card" id="createRoomCard">
                <div class="stack">
                    <div>
                        <div class="badge">Create Room</div>
                        <h1 style="margin: 8px 0 4px;">Start a new competition</h1>
                        <p>Pick routine or 1-day mode and invite friends.</p>
                    </div>
                    <button class="btn btn-primary" id="createBtn">Create</button>
                </div>
            </div>

            <div class="card" id="joinRoomCard">
                <div class="stack">
                    <div class="between flex">
                        <div>
                            <div class="badge" style="background: rgba(255,0,85,0.15); color: var(--accent);">Join Room</div>
                            <h1 style="margin: 8px 0 4px;">Enter 6-digit code</h1>
                            <p>Friends can share a code from their room.</p>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="join-code">Invite Code</label>
                        <input id="join-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456">
                    </div>
                    <button class="btn btn-outline" id="joinBtn">Join Room</button>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDA2c4ppqojUpSi090q7jyXSLR_8GTCXIw",
            authDomain: "hcd-piggy.firebaseapp.com",
            databaseURL: "https://hcd-piggy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hcd-piggy",
            storageBucket: "hcd-piggy.firebasestorage.app",
            messagingSenderId: "663289864346",
            appId: "1:663289864346:web:8eba034298e5681d7b3f23"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const database = getDatabase(app);
        
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseDatabase = database;
        window.firebaseApp = app;
    </script>
    
    
    <script type="module">
        document.addEventListener('DOMContentLoaded', async () => {
            // Check for localStorage/cookie availability
            let storageAvailable = false;
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                storageAvailable = true;
            } catch (e) {
                console.warn('localStorage/cookies disabled:', e);
                storageAvailable = false;
            }
            
            // Check if there's a room code in the URL (from sharing)
            const urlParams = new URLSearchParams(window.location.search);
            const sharedRoomCode = urlParams.get('join');
            
            // Load app module
            let app;
            try {
                const appModule = await import('./js/app.js');
                app = appModule.default;
                await app.initializeFirebase();
            } catch (error) {
                console.error('Failed to load app module or Firebase:', error);
                if (!storageAvailable) {
                    alert('This app requires cookies and localStorage to function. Please enable cookies and refresh the page.');
                    return;
                }
            }

            // Check for user
            const user = app.requireUser();
            if (!user) {
                return;
            }
            
            // Get initial active room from localStorage
            let activeRoom = app.getActiveRoom();
            const greeting = document.getElementById('greeting');
            const createBtn = document.getElementById('createBtn');
            const joinBtn = document.getElementById('joinBtn');
            const joinCode = document.getElementById('join-code');
            const logoutBtn = document.getElementById('logoutBtn');
            const lobbyContent = document.getElementById('lobbyContent');
            const createRoomCard = document.getElementById('createRoomCard');
            const joinRoomCard = document.getElementById('joinRoomCard');
            const oldCompetitionsSection = document.getElementById('oldCompetitionsSection');
            const oldCompetitionsContainer = document.getElementById('oldCompetitionsContainer');

            // Fetch fresh room data from Firebase if available to get correct participant count
            let freshRoomData = activeRoom;
            if (activeRoom && activeRoom.id && app.isFirebaseReady()) {
                try {
                    const fbRoom = await app.getRoom(activeRoom.id);
                    if (fbRoom) {
                        freshRoomData = fbRoom;
                        app.saveActiveRoom(freshRoomData);
                    }
                } catch (error) {
                    console.warn('Could not fetch fresh room data:', error);
                    freshRoomData = activeRoom;
                }
            }

            // Check if the active room has ended
            const roomHasEnded = freshRoomData && freshRoomData.id && app.isCompetitionEnded(freshRoomData);

            // Handle active/ended room display
            if (freshRoomData && freshRoomData.id && !roomHasEnded) {
                // Create active room card
                const activeRoomCard = document.createElement('div');
                activeRoomCard.className = 'card';
                activeRoomCard.style.border = '2px solid #00E054';
                activeRoomCard.innerHTML = `
                    <div class="stack">
                        <div>
                            <div class="badge" style="background: #00E054; color: white;">Active Room</div>
                            <h1 style="margin: 8px 0 4px;">${freshRoomData.name || 'Your Room'}</h1>
                            <p style="margin: 4px 0;">You're already in a room. Continue your progress!</p>
                            <div class="muted" style="font-size: 14px;">
                                Room Code: <strong>${freshRoomData.id}</strong> • 
                                ${freshRoomData.participants ? Object.keys(freshRoomData.participants).length : 1} participant(s)
                            </div>
                        </div>
                        <button class="btn btn-primary" id="goToRoomBtn" style="background: #00E054;">
                            🏠 Go to Your Room
                        </button>
                    </div>
                `;
                
                // Insert at the very top of the lobby content
                lobbyContent.insertBefore(activeRoomCard, lobbyContent.firstChild);
                
                // Add click handler for active room button
                const goToRoomBtn = document.getElementById('goToRoomBtn');
                goToRoomBtn?.addEventListener('click', () => {
                    window.location.href = 'room.html';
                });
                
                // Disable and gray out other options
                createRoomCard.style.opacity = '0.5';
                createRoomCard.style.pointerEvents = 'none';
                joinRoomCard.style.opacity = '0.5';
                joinRoomCard.style.pointerEvents = 'none';
                
                // Update card content to show they're disabled
                const createBadge = createRoomCard.querySelector('.badge');
                const joinBadge = joinRoomCard.querySelector('.badge');
                
                if (createBadge) createBadge.textContent = 'Unavailable';
                if (joinBadge) joinBadge.textContent = 'Unavailable';
                
                const createTitle = createRoomCard.querySelector('h1');
                const joinTitle = joinRoomCard.querySelector('h1');
                const createDesc = createRoomCard.querySelector('p');
                const joinDesc = joinRoomCard.querySelector('p');
                
                if (createTitle) createTitle.textContent = 'Already in a room';
                if (joinTitle) joinTitle.textContent = 'Already in a room';
                if (createDesc) createDesc.textContent = 'Leave your current room to create a new one.';
                if (joinDesc) joinDesc.textContent = 'Leave your current room to join another.';
                
                // Disable buttons
                if (createBtn) {
                    createBtn.textContent = 'In Active Room';
                    createBtn.disabled = true;
                }
                if (joinBtn) {
                    joinBtn.textContent = 'In Active Room';
                    joinBtn.disabled = true;
                }
                if (joinCode) {
                    joinCode.disabled = true;
                }
            } else if (roomHasEnded) {
                // Show old competitions section
                oldCompetitionsSection.style.display = 'block';
                
                // Create ended room card in old competitions
                const endedRoomCard = document.createElement('div');
                endedRoomCard.className = 'card';
                endedRoomCard.style.border = '1px solid var(--border)';
                endedRoomCard.style.opacity = '0.7';
                endedRoomCard.innerHTML = `
                    <div class="stack">
                        <div>
                            <div class="badge" style="background: rgba(100,100,100,0.2); color: var(--muted);">Completed</div>
                            <h1 style="margin: 8px 0 4px;">${activeRoom.name || 'Completed Competition'}</h1>
                            <p style="margin: 4px 0; color: var(--muted);">This competition has ended.</p>
                            <div class="muted" style="font-size: 14px;">
                                Room Code: <strong>${activeRoom.id}</strong> • 
                                ${activeRoom.participants ? Object.keys(activeRoom.participants).length : 1} participant(s)
                            </div>
                        </div>
                        <button class="btn btn-outline" id="viewResultsBtn">
                            🏆 View Results
                        </button>
                    </div>
                `;
                
                oldCompetitionsContainer.appendChild(endedRoomCard);
                
                // Add click handler for view results
                const viewResultsBtn = endedRoomCard.querySelector('#viewResultsBtn');
                viewResultsBtn?.addEventListener('click', () => {
                    localStorage.setItem('piggy-habit-room', JSON.stringify(activeRoom));
                    window.location.href = 'result.html';
                });
                
                // Clear active room to allow new creations/joins
                app.clearActiveRoom();
                
                // Create and show new room cards
                createRoomCard.style.opacity = '1';
                createRoomCard.style.pointerEvents = 'auto';
                joinRoomCard.style.opacity = '1';
                joinRoomCard.style.pointerEvents = 'auto';
                
                const createBadge = createRoomCard.querySelector('.badge');
                const joinBadge = joinRoomCard.querySelector('.badge');
                
                if (createBadge) createBadge.textContent = 'Create Room';
                if (joinBadge) joinBadge.textContent = 'Join Room';
                
                const createTitle = createRoomCard.querySelector('h1');
                const joinTitle = joinRoomCard.querySelector('h1');
                const createDesc = createRoomCard.querySelector('p');
                const joinDesc = joinRoomCard.querySelector('p');
                
                if (createTitle) createTitle.textContent = 'Start a new competition';
                if (joinTitle) joinTitle.textContent = 'Enter 6-digit code';
                if (createDesc) createDesc.textContent = 'Pick routine or 1-day mode and invite friends.';
                if (joinDesc) joinDesc.textContent = 'Friends can share a code from their room.';
                
                if (createBtn) {
                    createBtn.textContent = 'Create';
                    createBtn.disabled = false;
                }
                if (joinBtn) {
                    joinBtn.textContent = 'Join Room';
                    joinBtn.disabled = false;
                }
                if (joinCode) {
                    joinCode.disabled = false;
                }
            }

            // Auto-fill room code if shared (only if no active room)
            if (sharedRoomCode && joinCode && !activeRoom) {
                joinCode.value = sharedRoomCode;
                app.showToast(`Auto-filled room code: ${sharedRoomCode}`);
            }

            if (greeting && user?.nickname) {
                const firebaseStatus = app.isFirebaseReady() ? '🔥' : '📱';
                greeting.textContent = `Hi, ${user.nickname} ${firebaseStatus}`;
            }

            // Hide loading overlay after everything is loaded
            const loadingOverlay = document.getElementById('lobbyLoadingOverlay');
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }

            createBtn?.addEventListener('click', async () => {
                const currentActiveRoom = app.getActiveRoom();
                const hasActiveRoom = currentActiveRoom && currentActiveRoom.id;
                
                if (hasActiveRoom) {
                    app.showToast('You already have an active room. Go to your room or logout to create a new one.');
                    return;
                }
                
                window.location.href = 'create.html';
            });

            joinBtn?.addEventListener('click', async () => {
                const currentActiveRoom = app.getActiveRoom();
                if (currentActiveRoom && currentActiveRoom.id) {
                    app.showToast('You already have an active room. Go to your room or logout to join another.');
                    return;
                }
                
                const code = joinCode?.value?.trim();
                
                if (!code || !/^[0-9]{6}$/.test(code)) {
                    app.showToast('Enter a valid 6-digit code.');
                    joinCode?.focus();
                    return;
                }
                
                try {
                    joinBtn.disabled = true;
                    joinBtn.textContent = 'Joining...';
                    
                    const room = await app.joinRoom(code);
                    
                    app.showToast(`Joined room ${code}!`);
                    
                    // Check if user has completed onboarding for this room
                    let hasCompletedOnboarding = false;
                    const currentUser = app.getUser();
                    
                    if (room && room.participants && currentUser) {
                        const userParticipant = room.participants[currentUser.userId];
                        hasCompletedOnboarding = userParticipant && userParticipant.color && userParticipant.onboardingComplete;
                    }
                    
                    // Redirect based on onboarding status
                    const redirectUrl = hasCompletedOnboarding ? 'room.html' : `onboarding.html?type=${room.mode || 'routine'}`;
                    
                    if (storageAvailable) {
                        setTimeout(() => {
                            window.location.href = redirectUrl;
                        }, 500);
                    } else {
                        window.location.href = redirectUrl;
                    }
                } catch (error) {
                    console.error('Error joining room:', error);
                    
                    // Show specific error messages
                    if (error.message.includes('does not exist')) {
                        app.showToast(`Room ${code} does not exist. Check the code and try again.`);
                    } else if (error.message.includes('not found')) {
                        app.showToast(`Room ${code} does not exist. Check the code and try again.`);
                    } else if (error.message.includes('not ready')) {
                        app.showToast('Connection issue. Please check your internet and try again.');
                    } else if (error.message.includes('no longer active')) {
                        app.showToast(`Room ${code} is no longer active.`);
                    } else {
                        app.showToast('Failed to join room: ' + error.message);
                    }
                } finally {
                    joinBtn.disabled = false;
                    joinBtn.textContent = 'Join';
                }
            });

            logoutBtn?.addEventListener('click', async () => {
                try {
                    await app.clearUser();
                    app.showToast('Logged out');
                    setTimeout(() => window.location.href = 'index.html', 400);
                } catch (error) {
                    console.error('Logout error:', error);
                    app.showToast('Error logging out');
                }
            });
        });
    </script>
</body>
</html>
