<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Piggy Habit | Room</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">
    <header id="roomHeader" style="padding: 20px; color: #0b1b0f; background: linear-gradient(135deg, #00E054, #00b045);">
        <div class="between flex">
            <div>
                <div id="roomTitle" style="font-weight: 800; font-size: 22px;"></div>
            </div>
            <div class="flex" style="gap: 8px;">
                <button class="btn btn-outline btn-small" style="background: rgba(0,0,0,0.12); color:#0b1b0f; border-color: rgba(255,255,255,0.25);" onclick="window.location.href='lobby.html'">Lobby</button>
            </div>
        </div>
        <div id="leaderBanner" class="pill mt-8" style="background: rgba(0,0,0,0.15); color:#0b1b0f;"></div>
    </header>

    <!-- Loading overlay - shown while Firebase data loads -->
    <div id="roomLoadingOverlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f1115; z-index: 9999; display: flex; align-items: center; justify-content: center;">
        <div class="card stack" style="text-align: center; max-width: 300px;">
            <div class="muted">Loading room...</div>
            <div style="padding: 20px;">
                <div style="font-size: 32px; animation: spin 1s linear infinite;">🐷</div>
            </div>
        </div>
    </div>

    <main class="page" style="padding-top:16px;">
        <!-- Room Code Section -->
        <div class="card" style="margin-bottom: 12px; padding: 12px; background: #f8f9fa; border: 1px solid #dee2e6;">
            <div style="text-align: center;">
                <div style="font-size: 12px; color: #6c757d; margin-bottom: 4px;">Room Code</div>
                <div id="roomCodeDisplay" style="font-size: 18px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; color: #495057;"></div>
                <div style="display: flex; gap: 6px; justify-content: center;">
                    <button id="copyRoomCodeBtn" class="btn btn-primary btn-small" style="font-size: 12px; padding: 6px 12px;">
                        📋 Copy
                    </button>
                    <button id="shareRoomBtn" class="btn btn-outline btn-small" style="font-size: 12px; padding: 6px 12px; background: white; color: #495057; border-color: #dee2e6;">
                        📤 Share
                    </button>
                </div>
            </div>
        </div>

        <!-- Quit Competition Early Section (for testing) -->
        <div class="card" style="margin-bottom: 12px; padding: 12px; background: #fff3cd; border: 1px solid #ffeaa7;">
            <div style="text-align: center;">
                <div style="font-size: 12px; color: #856404; margin-bottom: 8px;">Testing Mode</div>
                <button id="quitEarlyBtn" class="btn btn-outline btn-small" style="font-size: 12px; padding: 6px 12px; background: #fff3cd; color: #856404; border-color: #ffeaa7;">
                    ⚠️ Quit Competition Early
                </button>
            </div>
        </div>

        <div id="competitionEndedBanner" class="card" style="margin-bottom: 12px; text-align: center; background: #ffe4e1; border: 1px solid #ffb3a7; display: none;">
            <div style="font-weight: 700; color: #c41e3a; font-size: 16px; margin-bottom: 12px;">⏰ Competition Has Ended</div>
            <button class="btn btn-primary" type="button" onclick="window.location.href='result.html'" style="width: 100%;">🏆 View Results</button>
        </div>

        <div class="tab-bar">
            <div class="tab active" data-tab="mission">🔥 My Mission</div>
            <div class="tab" data-tab="feed">👀 Feed</div>
            <div class="tab" data-tab="rank">🏆 Ranking</div>
        </div>

        <section id="missionTab" class="stack"></section>
        <section id="feedTab" class="stack" style="display:none;"></section>
        <section id="rankTab" class="stack" style="display:none;"></section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <input id="fileCapture" type="file" accept="image/*" capture="environment" style="display:none;">

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDA2c4ppqojUpSi090q7jyXSLR_8GTCXIw",
            authDomain: "hcd-piggy.firebaseapp.com",
            databaseURL: "https://hcd-piggy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hcd-piggy",
            storageBucket: "hcd-piggy.firebasestorage.app",
            messagingSenderId: "663289864346",
            appId: "1:663289864346:web:8eba034298e5681d7b3f23"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const database = getDatabase(app);
        
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseDatabase = database;
        window.firebaseApp = app;
    </script>
    
    <script type="module">
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Room page DOM loaded');
            
            // Check if user just completed an upload
            if (sessionStorage.getItem('uploadJustCompleted')) {
                console.log('✅ User just completed upload - showing success message');
                sessionStorage.removeItem('uploadJustCompleted');
                
                // Ensure we don't get redirected anywhere else
                window.uploadJustCompleted = true;
                
                // Show success toast after a short delay
                setTimeout(() => {
                    const toast = document.getElementById('toast');
                    if (toast) {
                        toast.textContent = '✅ Photo uploaded successfully!';
                        toast.classList.add('show');
                        setTimeout(() => toast.classList.remove('show'), 4000);
                    }
                }, 500);
                
                // Force focus on feed tab to show the new submission
                setTimeout(() => {
                    const feedBtn = document.querySelector('[data-tab="feed"]');
                    if (feedBtn) {
                        feedBtn.click();
                        console.log('🎯 Auto-switched to feed tab after upload');
                    }
                }, 1000);
            }
            
            // Safety check: prevent any redirects to verify.html
            if (window.location.pathname.includes('verify.html')) {
                console.log('🚨 DETECTED UNWANTED VERIFY REDIRECT - Forcing back to room');
                window.location.replace('room.html');
                return;
            }
            
            // Load app module
            let app;
            try {
                const appModule = await import('./js/app.js');
                app = appModule.default;
                
                // Initialize Firebase
                await app.initializeFirebase();
                console.log('Firebase ready in room:', app.isFirebaseReady());
            } catch (error) {
                console.error('Failed to load app module:', error);
                return;
            }

            const user = app.requireUser();
            let roomData = JSON.parse(localStorage.getItem('piggy-habit-room') || '{}');
            window.roomData = roomData;
            
            if (!roomData || Object.keys(roomData).length === 0) {
                window.location.href = 'lobby.html';
                return;
            }

            const roomName = roomData.name || 'Competition Room';
            const mode = roomData.mode;
            const color = roomData.color || '#00E054';
            const today = new Date().toDateString();
            
            document.title = `Piggy Habit | ${roomName}`;
            
            let participants = roomData.participants ? Object.values(roomData.participants) : [];
            
            // Helper to find current user consistently
            const findCurrentUser = (participantsList) => {
                const firebaseUid = app.getCurrentUser()?.uid;
                const cachedUserId = user.userId;
                const nickname = user.nickname;
                
                return participantsList.find(p => 
                    p.userId === firebaseUid || 
                    p.userId === cachedUserId || 
                    p.nickname === nickname
                );
            };
            
            // Check onboarding status
            let hasCompletedOnboarding = false;
            
            try {
                // Try to get fresh data from Firebase for onboarding check
                if (app.isFirebaseReady() && roomData.id) {
                    console.log('🔍 Loading fresh Firebase data for onboarding check...');
                    const freshRoomData = await app.getRoom(roomData.id);
                    
                    if (freshRoomData?.participants) {
                        const freshParticipants = Object.values(freshRoomData.participants);
                        const userParticipant = findCurrentUser(freshParticipants);
                        
                        hasCompletedOnboarding = !!(
                            userParticipant?.goals?.length > 0 && 
                            userParticipant?.color && 
                            userParticipant?.onboardingComplete
                        );
                                               
                        // Update local data with fresh data
                        if (freshRoomData) {
                            roomData = { ...roomData, ...freshRoomData };
                            participants = freshParticipants;
                        }
                    }
                }
                
                // Fallback to cached data check if Firebase fails or user not found
                if (!hasCompletedOnboarding) {
                    console.log('🔄 Trying fallback onboarding check with cached data...');
                    const cachedUser = app.getUser();
                    const firebaseUserId = app?.getCurrentUser()?.uid;
                    const cachedUserId = cachedUser?.userId;
                    const nickname = cachedUser?.nickname;
                    
                    let userParticipantFromCache = null;
                    
                    // Try multiple matching strategies for cached data too
                    if (firebaseUserId) {
                        userParticipantFromCache = participants.find(p => p.userId === firebaseUserId);
                    }
                    if (!userParticipantFromCache && cachedUserId) {
                        userParticipantFromCache = participants.find(p => p.userId === cachedUserId);
                    }
                    if (!userParticipantFromCache && nickname) {
                        userParticipantFromCache = participants.find(p => p.nickname === nickname);
                    }
                    
                    console.log('🔄 Cached data onboarding check:', {
                        userFound: !!userParticipantFromCache,
                        userParticipant: userParticipantFromCache ? {
                            userId: userParticipantFromCache.userId,
                            nickname: userParticipantFromCache.nickname,
                            hasGoals: !!userParticipantFromCache.goals,
                            hasColor: !!userParticipantFromCache.color,
                            onboardingComplete: userParticipantFromCache.onboardingComplete
                        } : 'USER NOT FOUND IN CACHE'
                    });
                    
                    hasCompletedOnboarding = userParticipantFromCache && 
                                           userParticipantFromCache.goals && 
                                           userParticipantFromCache.goals.length > 0 && 
                                           userParticipantFromCache.color && 
                                           userParticipantFromCache.onboardingComplete === true;
                }
                
            } catch (error) {
                console.warn('Failed to check onboarding status from Firebase:', error);
                // Use cached data as fallback
            }
            
            console.log('🎯 Final onboarding status:', hasCompletedOnboarding);
            
            if (!hasCompletedOnboarding) {
                console.log('User has not completed onboarding, redirecting');
                window.location.href = `onboarding.html?type=${mode}`;
                return;
            }
            // Load fresh data from Firebase asynchronously (non-blocking)
            const loadFirebaseData = async () => {
                const startTime = Date.now();
                if (!app.isFirebaseReady() || !roomData.id) return;
                
                try {
                    const firebaseRoom = await app.getRoom(roomData.id);
                    const loadTime = Date.now() - startTime;
                    
                    if (firebaseRoom) {
                        console.log('🔄 Loading fresh Firebase data:', {
                            participants: Object.keys(firebaseRoom.participants || {}).length,
                            submissions: Object.keys(firebaseRoom.submissions || {}).length,
                            roomId: roomData.id,
                            mode: firebaseRoom.mode,
                            loadTime: `${loadTime}ms`
                        });
                        
                        // Update room data completely
                        roomData = { ...roomData, ...firebaseRoom };
                        window.roomData = roomData; // Ensure window.roomData is also updated
                        
                        // Update participants from Firebase with better logging
                        if (firebaseRoom.participants) {
                            const newParticipants = Object.values(firebaseRoom.participants);
                            console.log('👥 Updating participants from Firebase:', {
                                oldCount: participants.length,
                                newCount: newParticipants.length,
                                oldParticipants: participants.map(p => ({ userId: p.userId, nickname: p.nickname })),
                                newParticipants: newParticipants.map(p => ({ userId: p.userId, nickname: p.nickname }))
                            });
                            
                            participants = newParticipants;
                            
                            // Ensure UI reflects the updated participant count
                            console.log('✅ Participants updated, refreshing UI components');
                        } else {
                            console.warn('⚠️ No participants found in Firebase room data');
                        }
                        
                        // Update UI with fresh data (only if functions are already defined)
                        if (typeof updateParticipantCount === 'function') updateParticipantCount();
                        if (typeof refreshRanking === 'function') refreshRanking();
                        if (typeof updateFeed === 'function') updateFeed();
                        
                        // Save essential data (non-blocking)
                        setTimeout(() => saveEssentialData(roomData), 0);
                        
                        const totalTime = Date.now() - startTime;
                        console.log(`✅ Firebase data load completed in ${totalTime}ms`);
                    }
                } catch (error) {
                    const errorTime = Date.now() - startTime;
                    console.warn(`❌ Failed to load Firebase data after ${errorTime}ms:`, error);
                }
            };
            
            const saveEssentialData = (data) => {
                try {
                    const essentialData = {
                        id: data.id,
                        name: data.name,
                        code: data.code,
                        nickname: data.nickname,
                        color: data.color,
                        goals: data.goals,
                        mode: data.mode,
                        onboardingComplete: data.onboardingComplete,
                        createdAt: data.createdAt,
                        duration: data.duration
                    };
                    localStorage.setItem('piggy-habit-room', JSON.stringify(essentialData));
                    console.log('💾 Saved essential data to localStorage with mode:', data.mode);
                } catch (error) {
                    // Ignore localStorage errors
                }
            };

            // Set up real-time updates (non-blocking)
            const setupRealTimeUpdates = () => {
                if (app.isFirebaseReady() && roomData.id) {
                    app.subscribeToRoom(roomData.id, (updatedRoomData) => {
                        console.log('📡 Real-time update received:', {
                            participants: Object.keys(updatedRoomData.participants || {}).length,
                            submissions: Object.keys(updatedRoomData.submissions || {}).length
                        });
                        
                        // Store old data for comparison BEFORE updating
                        const oldSubmissionData = JSON.stringify(roomData.submissions || {});
                        const oldParticipants = participants.slice();
                        
                        // Update roomData FIRST so that subsequent function calls use fresh data
                        roomData = { ...roomData, ...updatedRoomData };
                        
                        // Check for submission changes
                        if (updatedRoomData.submissions) {
                            const newSubmissionData = JSON.stringify(updatedRoomData.submissions);
                            if (newSubmissionData !== oldSubmissionData) {
                                console.log('📝 Submissions changed, updating feed and rankings');
                                if (typeof updateFeed === 'function') updateFeed();
                                if (typeof refreshRanking === 'function') refreshRanking();
                            }
                        }
                        
                        // Check for participant changes
                        if (updatedRoomData.participants) {
                            const newParticipants = Object.values(updatedRoomData.participants);
                            const participantsChanged = newParticipants.length !== oldParticipants.length || 
                                JSON.stringify(newParticipants.map(p => ({id: p.userId, nickname: p.nickname}))) !== 
                                JSON.stringify(oldParticipants.map(p => ({id: p.userId, nickname: p.nickname})));
                            
                            if (participantsChanged) {
                                console.log('👥 Participants changed via real-time update:', {
                                    oldCount: oldParticipants.length,
                                    newCount: newParticipants.length,
                                    oldParticipants: oldParticipants.map(p => p.nickname),
                                    newParticipants: newParticipants.map(p => p.nickname)
                                });
                                
                                participants = newParticipants;
                                if (typeof updateParticipantCount === 'function') updateParticipantCount();
                                if (typeof refreshRanking === 'function') refreshRanking();
                                if (typeof updateFeed === 'function') updateFeed();
                            }
                        }
                        
                        // Check if competition was ended and show banner
                        const competitionEndedBanner = document.getElementById('competitionEndedBanner');
                        if (competitionEndedBanner && updatedRoomData.manuallyEnded) {
                            competitionEndedBanner.style.display = 'block';
                        }
                    });
                }
            };

            const header = document.getElementById('roomHeader');
            const roomTitle = document.getElementById('roomTitle');
            const leaderBanner = document.getElementById('leaderBanner');
            const missionTab = document.getElementById('missionTab');
            const feedTab = document.getElementById('feedTab');
            const rankTab = document.getElementById('rankTab');
            const tabButtons = document.querySelectorAll('.tab');
            
            // Helper functions for UI updates
            const updateParticipantCount = () => {
                if (leaderBanner && participants.length > 0) {
                    if (mode === 'routine') {
                        const leader = getLeader();
                        const iAmLeader = leader && leader.nickname === user.nickname;
                        
                        if (participants.length <= 1) {
                            leaderBanner.textContent = `${participants.length} participant in room`;
                        } else if (leader) {
                            leaderBanner.textContent = iAmLeader
                                ? 'You are leading! Keep the pace!'
                                : `👑 ${leader.nickname} is leading with ${leader.calculatedScore || 0} pts!`;
                        } else {
                            leaderBanner.textContent = `${participants.length} participants in room`;
                        }
                    } else {
                        // For oneday mode, show participant count
                        leaderBanner.textContent = participants.length === 1
                            ? '1 participant in room'
                            : `${participants.length} participants in room`;
                    }
                }
            };
            
            const getLeader = () => {
                if (participants.length <= 1) return null;
                
                console.log('🔍 getLeader called with mode:', mode, 'roomData.mode:', roomData.mode);
                
                // Calculate scores based on mode
                const participantsWithScores = participants.map(p => {
                    if (mode === 'oneday') {
                        // For oneday: calculate percentage of tasks completed
                        const oneDayReferenceDate = new Date(roomData.dday).toDateString();
                        const userSubmissions = Object.values(roomData.submissions || {}).filter(s => 
                            s.userId === p.userId && 
                            s.status === 'approved' &&
                            new Date(s.submittedAt).toDateString() === oneDayReferenceDate
                        );
                        const tasksCompleted = userSubmissions.length;
                        const totalTasks = (p.goals && p.goals.length) ? p.goals.length : 0;
                        const percentage = totalTasks > 0 ? (tasksCompleted / totalTasks) * 100 : 0;
                        return { ...p, calculatedScore: percentage, scoreType: 'percentage' };
                    } else {
                        // For routine: calculate points from approved submissions
                        const userSubmissions = Object.values(roomData.submissions || {}).filter(s => 
                            s.userId === p.userId && s.status === 'approved'
                        );
                        const calculatedPoints = userSubmissions.reduce((total, sub) => {
                            return total + (sub.task?.points || 10);
                        }, 0);
                        return { ...p, calculatedScore: calculatedPoints, scoreType: 'points' };
                    }
                });
                
                const sorted = participantsWithScores.slice().sort((a,b) => b.calculatedScore - a.calculatedScore);
                const topScore = sorted[0].calculatedScore || 0;
                const hasCompetition = topScore > 0 && sorted.some(p => p.calculatedScore < topScore);
                
                console.log('🏆 getLeader result:', {
                    mode,
                    topScore,
                    hasCompetition,
                    winner: sorted[0] ? { nickname: sorted[0].nickname, score: sorted[0].calculatedScore, scoreType: sorted[0].scoreType } : null,
                    allScores: sorted.map(p => ({ nickname: p.nickname, score: p.calculatedScore, scoreType: p.scoreType }))
                });
                
                return hasCompetition ? sorted[0] : null;
            };
            
            // Update leader in Firebase for real-time tracking (for IoT devices, etc.)
            const updateLeaderInFirebase = async (leaderData) => {
                if (!roomData.id || !leaderData) {
                    // Clear leader if no competition
                    if (roomData.id && !leaderData) {
                        try {
                            await app.updateRoom(roomData.id, { currentLeader: null });
                        } catch (error) {
                            console.warn('Failed to clear leader:', error);
                        }
                    }
                    return;
                }
                
                try {
                    await app.updateRoom(roomData.id, {
                        currentLeader: {
                            nickname: leaderData.nickname,
                            userId: leaderData.userId,
                            color: leaderData.color,
                            score: leaderData.calculatedScore,
                            scoreType: leaderData.scoreType,
                            updatedAt: Date.now()
                        }
                    });
                    console.log('✅ Leader updated in Firebase:', leaderData.nickname, '-', leaderData.calculatedScore, leaderData.scoreType);
                } catch (error) {
                    console.warn('Failed to update leader in Firebase:', error);
                }
            };
            
            // Define renderRanking before it's called
            let renderRanking;
            
            const refreshRanking = () => {
                // Always update ranking data for real-time updates
                if (renderRanking) renderRanking();
                
                // Update leader in Firebase for IoT/external access
                const leaderData = getLeader();
                updateLeaderInFirebase(leaderData);
            };
            
            const updateFeed = () => {
                // Check if generateFeedData is defined before calling
                if (typeof generateFeedData !== 'function') {
                    console.warn('generateFeedData not yet defined');
                    return;
                }
                
                // Always regenerate and render feed data - this ensures it updates automatically
                const newFeedData = generateFeedData();
                feedData.length = 0;
                feedData.push(...newFeedData);
                
                // Always render if the feed tab exists (whether visible or not)
                // This ensures the feed is up-to-date when you switch to it
                if (feedTab) {
                    renderFeed();
                }
            };
            
            // Helper function to check if user needs onboarding setup
            const checkUserSetup = () => {
                const currentUserId = app?.getCurrentUser()?.uid || user?.userId;
                
                // Check current room participants for this user
                let userParticipant = null;
                if (roomData && roomData.participants) {
                    const allParticipants = Object.values(roomData.participants);
                    userParticipant = allParticipants.find(p => 
                        p.userId === currentUserId || p.nickname === user.nickname
                    );
                }
                
                const needsSetup = !userParticipant || !userParticipant.goals || 
                                 userParticipant.goals.length === 0 || !userParticipant.color;
                
                console.log('🔍 User setup check:', {
                    currentUserId,
                    userNickname: user.nickname,
                    userParticipant: userParticipant ? {
                        hasGoals: !!userParticipant.goals,
                        goalsLength: userParticipant.goals ? userParticipant.goals.length : 0,
                        hasColor: !!userParticipant.color
                    } : 'NOT FOUND',
                    needsSetup
                });
                
                return { needsSetup, userParticipant };
            };
            
            // Get DOM elements
            const fileCapture = document.getElementById('fileCapture');

            console.log('Elements found:', { header, roomTitle, leaderBanner });
            
            // Initialize UI immediately with cached data
            if (roomTitle) roomTitle.textContent = roomName;
            
            // Clean up any old proof data
            const proofDone = JSON.parse(localStorage.getItem('piggy-habit-proof-done') || 'null');
            if (proofDone) localStorage.removeItem('piggy-habit-proof-done');
            
            // Initialize with fallback participant data
            const fbUser = app.getCurrentUser();
            const fbUserId = fbUser ? fbUser.uid : user.userId;
            
            if (roomData.participants) {
                participants = Object.values(roomData.participants);
                console.log('🎯 Loaded participants for ranking:', {
                    count: participants.length,
                    participants: participants.map(p => ({
                        nickname: p.nickname,
                        userId: p.userId,
                        points: 'calculated'
                    }))
                });
            } else {
                // Add current user as fallback
                participants = [{ 
                    userId: fbUserId,
                    nickname: user.nickname, 
                    score: 0, // Will be calculated from submissions
                    rate: 0.0, 
                    color 
                }];
                console.log('⚠️ No participants data found, using fallback for:', user.nickname);
            }
            
            // Show initial UI state
            updateParticipantCount();
            
            // Load Firebase data asynchronously
            await loadFirebaseData();
            
            // Initialize leader in Firebase after data is loaded
            const initialLeader = getLeader();
            await updateLeaderInFirebase(initialLeader);
            
            // Set up real-time updates
            setupRealTimeUpdates();
            
            // Display room code in dedicated section
            const roomCodeDisplay = document.getElementById('roomCodeDisplay');
            const copyRoomCodeBtn = document.getElementById('copyRoomCodeBtn');
            const shareRoomBtn = document.getElementById('shareRoomBtn');
            
            if (roomCodeDisplay && roomData.id) {
                roomCodeDisplay.textContent = roomData.id.toUpperCase();
                
                // Copy room code functionality
                if (copyRoomCodeBtn) {
                    copyRoomCodeBtn.addEventListener('click', async () => {
                        try {
                            await navigator.clipboard.writeText(roomData.id.toUpperCase());
                            app.showToast('Room code copied!');
                        } catch (error) {
                            console.error('Failed to copy room code:', error);
                            app.showToast('Failed to copy room code');
                        }
                    });
                }
                
                // Share room functionality
                if (shareRoomBtn) {
                    shareRoomBtn.addEventListener('click', async () => {
                        const shareData = {
                            title: 'Join my Piggy Habit room!',
                            text: `Join room "${roomName}" with code: ${roomData.id.toUpperCase()}`,
                            url: `${window.location.origin}/lobby.html?join=${roomData.id.toUpperCase()}`
                        };
                        
                        try {
                            if (navigator.share) {
                                await navigator.share(shareData);

                                        timeAgo < 60 ? `${timeAgo} min ago` :

            let feedData = [];
            let lastRenderedFeedIds = new Set(); // Track what we've already rendered
            
            // Handle approval/rejection of submissions
            const handleApproval = async (submission, isApproval, submissionId) => {
                try {
                    const currentUserId = app.getCurrentUser()?.uid || user.userId;
                    
                    // Use provided submissionId or try to find it as fallback
                    let actualSubmissionId = submissionId;
                    if (!actualSubmissionId) {
                        console.warn('No submissionId provided, attempting to find it...');
                        actualSubmissionId = Object.keys(roomData.submissions || {}).find(key => {
                            const stored = roomData.submissions[key];
                            return stored && stored.userId === submission.userId && 
                                   stored.submittedAt === submission.submittedAt;
                        });
                    }
                    
                    if (!actualSubmissionId) {
                        console.error('Submission ID not found:', {
                            submissionUserId: submission.userId,
                            submissionTime: submission.submittedAt,
                            availableSubmissions: Object.keys(roomData.submissions || {}),
                            providedId: submissionId
                        });
                        app.showToast('Error: Could not find submission');
                        return;
                    }
                    
                    console.log('Processing approval for submission:', actualSubmissionId);
                    
                    // Don't allow voting on own submissions
                    if (submission.userId === currentUserId) {
                        app.showToast('You cannot vote on your own submission');
                        return;
                    }
                    
                    // Initialize arrays if they don't exist
                    const currentApprovals = submission.approvals || [];
                    const currentRejections = submission.rejections || [];
                    
                    // Remove user from both arrays first (in case they're changing their vote)
                    const newApprovals = currentApprovals.filter(uid => uid !== currentUserId);
                    const newRejections = currentRejections.filter(uid => uid !== currentUserId);
                    
                    // Add to appropriate array
                    if (isApproval) {
                        newApprovals.push(currentUserId);
                        app.showToast('Vote submitted: Approved');
                    } else {
                        newRejections.push(currentUserId);
                        app.showToast('Vote submitted: Rejected');
                    }
                    
                    // Calculate if submission should be approved or rejected
                    const totalVoters = participants.filter(p => p.userId !== submission.userId).length;
                    const requiredApprovals = Math.ceil(totalVoters / 2); // Majority needed
                    
                    let newStatus = submission.status;
                    let pointsEarned = 0;
                    
                    if (newApprovals.length >= requiredApprovals) {
                        newStatus = 'approved';
                        pointsEarned = submission.task?.points || 0;
                        
                        // Update submitter's score
                        const submitterParticipant = participants.find(p => p.userId === submission.userId);
                        if (submitterParticipant) {
                            const updateData = {
                                [`participants/${submission.userId}/score`]: (submitterParticipant.score || 0) + pointsEarned
                            };
                            await app.updateRoom(roomData.id, updateData);
                        }
                    } else if (newRejections.length >= requiredApprovals) {
                        newStatus = 'rejected';
                    }
                    
                    // Prepare Firebase update data
                    const updateData = {
                        [`submissions/${actualSubmissionId}/approvals`]: newApprovals,
                        [`submissions/${actualSubmissionId}/rejections`]: newRejections,
                        [`submissions/${actualSubmissionId}/status`]: newStatus
                    };
                    
                    // If approved, also update the participant's score
                    if (newStatus === 'approved' && pointsEarned > 0) {
                        const submitterParticipant = participants.find(p => p.userId === submission.userId);
                        if (submitterParticipant) {
                            updateData[`participants/${submission.userId}/score`] = (submitterParticipant.score || 0) + pointsEarned;
                        }
                    }
                    
                    console.log('🔄 Updating Firebase with approval data:', updateData);
                    await app.updateRoom(roomData.id, updateData);
                    console.log('✅ Approval vote submitted successfully');
                    
                    // Force immediate UI refresh
                    setTimeout(async () => {
                        await loadFirebaseData();
                    }, 500);
                    
                    // Show status message
                    if (newStatus === 'approved') {
                        if (mode === 'oneday') {
                            app.showToast(`🎉 Submission approved! ${submission.submittedBy} completed the task.`);
                        } else {
                            app.showToast(`🎉 Submission approved! ${submission.submittedBy} earned ${pointsEarned} points.`);
                        }
                    } else if (newStatus === 'rejected') {
                        app.showToast(`❌ Submission rejected. ${submission.submittedBy} can try again.`);
                    }
                    
                } catch (error) {
                    console.error('Error handling approval:', error);
                    app.showToast('Error submitting vote. Please try again.');
                }

            const renderFeed = () => {

                // Only rebuild cards that don't already exist in the DOM

                    if (existingCard && cardData.submissionData && cardData.status === 'pending') {

                        let approvalSection = existingCard.querySelector('[data-approval-section]');

                                    <div class="muted" style="font-size: 12px; margin-bottom: 8px;">

                                const rejectBtn = document.createElement('button');

                                rejectBtn.setAttribute('data-reject', 'true');
                                rejectBtn.textContent = `👎 Reject (${cardData.rejections || 0})`;
                                rejectBtn.addEventListener('click', async () => {
                                    await handleApproval(cardData.submissionData, false, cardData.submissionId);

                                buttonContainer.appendChild(approveBtn);
                                buttonContainer.appendChild(rejectBtn);
                                approvalSection.appendChild(buttonContainer);

                        } else {
                            // Update existing approval buttons
                            // Check if buttons actually exist
                            if (approveBtn && rejectBtn) {

                                rejectBtn.textContent = `👎 Reject (${cardData.rejections || 0})`;
                            } else {

                                const buttonContainer = document.createElement('div');
                                buttonContainer.className = 'between flex';
                                buttonContainer.style.gap = '8px';
                                
                                const newApproveBtn = document.createElement('button');
                                newApproveBtn.className = 'btn btn-primary btn-small';
                                newApproveBtn.textContent = `👍 Approve (${cardData.approvals || 0})`;
                                newApproveBtn.addEventListener('click', async () => {
                                    await handleApproval(cardData.submissionData, true, cardData.submissionId);

                                const newRejectBtn = document.createElement('button');
                                newRejectBtn.className = 'btn btn-outline btn-small';
                                newRejectBtn.setAttribute('data-reject', 'true');

                    }
                    
                    // If card exists but status changed (from pending to approved/rejected), remove it and recreate
                    if (existingCard) {

                        // Status indicator

                        // Approval buttons (only for pending submissions and not your own)

                            approveBtn.addEventListener('click', async () => {

                            buttonContainer.appendChild(approveBtn);

                        } else if (cardData.submissionData && cardData.submissionData.userId === currentUserId) {

                            } else if (cardData.status === 'approved') {

                        // Append to DOM immediately (no fragment - cards render as they're created)

                    }
                });
            };

        // --- Ranking Tab ---
            renderRanking = () => {
                if (!rankTab) {
                    console.warn('⚠️ Ranking tab not found');
                    return;
                }
                
                rankTab.innerHTML = ''; // Clear existing content
                
                if (!participants || participants.length === 0) {
                    rankTab.innerHTML = '<div class="muted" style="text-align: center; padding: 20px;">No participants yet</div>';
                    return;
                }
                
                if (!roomData) {
                    rankTab.innerHTML = '<div class="muted" style="text-align: center; padding: 20px;">Loading room data...</div>';
                    return;
                }
                
                console.log('🏆 RENDERING RANKING:', {
                    participantCount: participants.length,
                    participants: participants.map(p => ({
                        nickname: p.nickname,
                        userId: p.userId,
                        score: p.score || 0
                    })),
                    currentUser: user.nickname,
                    firebaseUser: app.getCurrentUser()?.uid,
                    hasSubmissions: !!(roomData.submissions && Object.keys(roomData.submissions).length > 0)
                });

            const sorted = participants.slice().map(p => {
                if (mode === 'routine') {
                    // Calculate actual points from approved submissions using task points
                    const userSubmissions = Object.values(roomData.submissions || {}).filter(s => 
                        s.userId === p.userId && s.status === 'approved'
                    );
                    // Use actual task points, not hardcoded 10
                    const calculatedPoints = userSubmissions.reduce((total, sub) => {
                        return total + (sub.task?.points || 10); // fallback to 10 if no task points
                    }, 0);
                    
                    console.log(`📊 Ranking calculation for ${p.nickname}:`, {
                        userId: p.userId,
                        totalSubmissions: Object.values(roomData.submissions || {}).filter(s => s.userId === p.userId).length,
                        approvedSubmissions: userSubmissions.length,
                        calculatedPoints,
                        storedScore: p.score || 0,
                        submissionPoints: userSubmissions.map(s => ({ taskPoints: s.task?.points || 10, taskLabel: s.task?.label || 'Unknown' })),
                        submissionIds: userSubmissions.map(s => s.id || 'no-id')
                    });
                    
                    return { ...p, points: calculatedPoints, submissionCount: userSubmissions.length };
                } else {
                    // For oneday mode, calculate percentage of tasks completed using the deadline date
                    const getOneDayReferenceDate = () => {
                        if (mode === 'oneday' && roomData.dday) {
                            const ddayDate = new Date(roomData.dday);
                            return ddayDate.toDateString();
                        }
                        return new Date().toDateString();
                    };
                    const oneDayReferenceDate = getOneDayReferenceDate();
                    
                    const userSubmissions = Object.values(roomData.submissions || {}).filter(s => 
                        s.userId === p.userId && 
                        s.status === 'approved' &&
                        new Date(s.submittedAt).toDateString() === oneDayReferenceDate
                    );
                    
                    // Count tasks completed (each submission is one task)
                    const tasksCompleted = userSubmissions.length;
                    // Use the PARTICIPANT'S goals, not the current user's goals
                    const totalTasks = (p.goals && p.goals.length) ? p.goals.length : 0;

                    console.log(`📊 Oneday ranking for ${p.nickname}:`, {

                        participantGoals: p.goals ? p.goals.length : 0,
                        percentage: Math.round(percentage),
                        approvedOnDeadlineDate: userSubmissions.length,
                        referenceDate: oneDayReferenceDate
                    });
                    
                    return { ...p, rate: percentage / 100, remaining: totalTasks - tasksCompleted, tasksCompleted };
                }

            // Initialize and start real-time updates
            const initialize = async () => {
                // Load initial Firebase data first

                // Generate feed data with loaded Firebase submissions
                const newFeedData = generateFeedData();
                feedData.length = 0;

                // Then render UI with fresh data

            // Auto-refresh data every 30 seconds for real-time updates
            let autoRefreshInterval;
            let windowFocusListener;
            
            const setupAutoRefresh = () => {
                // Clear existing interval if any
                if (autoRefreshInterval) clearInterval(autoRefreshInterval);
                
                // Reduced frequency from 30s to 60s to improve performance
                autoRefreshInterval = setInterval(async () => {
                    if (app.isFirebaseReady()) {
                        console.log('🔄 Auto-refreshing Firebase data (60s interval)');
                        try {
                            await loadFirebaseData();
                        } catch (error) {
                            console.warn('Auto-refresh failed:', error.message);
                        }
                    }
                }, 60000); // Changed from 30000 to 60000 (1 minute)
            };
            
            const setupWindowFocusRefresh = () => {
                // Remove existing listener if any
                if (windowFocusListener) {
                    window.removeEventListener('focus', windowFocusListener);
                }
                
                windowFocusListener = async () => {
                    if (app.isFirebaseReady()) {
                        console.log('🔄 Window focus refresh');
                        try {
                            await loadFirebaseData();
                        } catch (error) {
                            console.warn('Focus refresh failed:', error.message);
                        }
                    }
                };
                
                window.addEventListener('focus', windowFocusListener);
            };
            
            // Setup auto-refresh - reduce frequency to improve performance
            setupAutoRefresh();
            setupWindowFocusRefresh();
            
            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                if (autoRefreshInterval) clearInterval(autoRefreshInterval);
                if (windowFocusListener) window.removeEventListener('focus', windowFocusListener);
            });
            
            // Add performance logging
            console.log('🚀 Room setup complete, checking Firebase performance...');
            
            // Handle result button display and competition ended banner
            const competitionEndedBanner = document.getElementById('competitionEndedBanner');
            if (competitionEndedBanner) {
                const isCompetitionEnded = (() => {
                    // Check if competition was manually ended
                    if (roomData.manuallyEnded) {
                        return true;
                    }
                    
                    if (mode === 'routine') {
                        // Calculate if routine duration has been completed
                        const startDate = new Date(roomData.createdAt || Date.now());
                        const today = new Date();
                        const daysSinceStart = Math.floor((today - startDate) / (1000 * 60 * 60 * 24)) + 1;
                        const duration = roomData.duration || 30;
                        return daysSinceStart > duration;
                    } else {
                        // Check if one-day challenge deadline has passed
                        const deadline = roomData.dday;
                        if (deadline) {
                            const deadlineDate = new Date(deadline);
                            const today = new Date();
                            // Competition ends at end of deadline day
                            deadlineDate.setHours(23, 59, 59, 999);
                            return today > deadlineDate;
                        }
                        return false;
                    }
                })();
                
                if (isCompetitionEnded) {
                    competitionEndedBanner.style.display = 'block';
                }
            }
            
            // Quit Competition Early functionality - setup inside the main scope where all variables are accessible
            const setupQuitButton = () => {
                const quitBtn = document.getElementById('quitEarlyBtn');
                if (quitBtn) {
                    console.log('✅ Quit button found and setting up event listener');
                    console.log('🔍 App availability check:', {
                        appExists: !!app,
                        appMethods: app ? Object.keys(app) : 'app is undefined',
                        showToast: app ? typeof app.showToast : 'no app'
                    });
                    
                    quitBtn.addEventListener('click', async (e) => {
                        e.preventDefault();
                        console.log('🚨 Quit button clicked!');
                        
                        // Check if app is available
                        if (!app) {
                            console.error('❌ App not available!');
                            alert('Error: Application not ready. Please refresh the page.');
                            return;
                        }
                        
                        // Show immediate feedback
                        app.showToast('Processing quit request...');
                        
                        if (confirm('Are you sure you want to end this competition early? This action cannot be undone.')) {
                            try {
                                console.log('✅ User confirmed quit, starting process...');
                                
                                // Immediate UI feedback
                                quitBtn.disabled = true;
                                quitBtn.textContent = '⏳ Ending...';
                                quitBtn.style.background = '#ffc107';
                                quitBtn.style.color = '#212529';
                                
                                // Show processing toast
                                app.showToast('Calculating final results...');
                                
                                // Calculate final results using the getLeader function that's in scope
                                console.log('📊 Calculating leader...');
                                const leader = getLeader();
                                console.log('🏆 Leader calculated:', leader);
                                
                                const finalResults = {
                                    manuallyEnded: true,
                                    endedAt: Date.now(),
                                    endedBy: user?.nickname || 'Unknown',
                                    winner: leader ? {
                                        nickname: leader.nickname,
                                        userId: leader.userId,
                                        points: mode === 'oneday' ? Math.round(leader.calculatedScore) : leader.calculatedScore,
                                        color: leader.color
                                    } : null
                                };
                                
                                console.log('📝 Final results prepared:', finalResults);
                                app.showToast('Saving results to database...');
                                
                                // Update room using the app's Firebase methods with roomData.id (which is available in scope)
                                console.log('🔄 Updating room in Firebase:', roomData.id);
                                await app.updateRoom(roomData.id, finalResults);
                                console.log('✅ Room updated successfully');
                                
                                // Show success message and redirect
                                app.showToast('Competition ended successfully! Redirecting...');
                                
                                // Immediate redirect without delay
                                console.log('🔄 Redirecting to results page...');
                                window.location.href = 'result.html';
                                
                            } catch (error) {
                                console.error('❌ Error ending competition:', error);
                                app.showToast(`Failed to end competition: ${error.message}`);
                                
                                // Reset button state
                                quitBtn.disabled = false;
                                quitBtn.textContent = '⚠️ Quit Competition Early';
                                quitBtn.style.background = '#fff3cd';
                                quitBtn.style.color = '#856404';
                            }
                        } else {
                            console.log('❌ User cancelled quit');
                            app.showToast('Competition quit cancelled');
                        }
                    });
                } else {
                    console.error('❌ Quit button not found!');
                }
            };
            
            // Setup quit button after everything is initialized
            setupQuitButton();
        });
    </script>
</body>
</html>
