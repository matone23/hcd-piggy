<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Piggy Habit | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">
    <main class="page">
        <header class="stack mt-8">
            <div class="logo">
                <span class="logo-badge">🐷</span>
                Piggy Habit
            </div>
            <h1>Close the gap between intention and action.</h1>
            <p>Beat phone addiction with social pressure, neon feedback, and an IoT piggy bank.</p>
        </header>

        <section class="card mt-24">
            <div class="stack">
                <div class="input-group">
                    <label for="nickname">Nickname (max 8 chars)</label>
                    <input id="nickname" type="text" maxlength="8" placeholder="e.g. YehYoung" autocomplete="nickname">
                </div>

                <div class="input-group">
                    <label for="pin">4-digit PIN</label>
                    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="0000" autocomplete="one-time-code">
                    <span class="helper">Used to lock your piggy habits. Keep it simple.</span>
                </div>

                <button id="startBtn" class="btn btn-primary">Get Started</button>
                <button id="demoBtn" class="btn btn-ghost">Continue as Demo</button>
            </div>
        </section>

        <p class="center muted mt-16">By continuing you agree to stay accountable with your crew.</p>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDA2c4ppqojUpSi090q7jyXSLR_8GTCXIw",
            authDomain: "hcd-piggy.firebaseapp.com",
            databaseURL: "https://hcd-piggy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hcd-piggy",
            storageBucket: "hcd-piggy.firebasestorage.app",
            messagingSenderId: "663289864346",
            appId: "1:663289864346:web:8eba034298e5681d7b3f23",
            measurementId: "G-KFPDZ1GW62"
        };

        // Initialize Firebase
        const firebaseApp = initializeApp(firebaseConfig);
        const analytics = getAnalytics(firebaseApp);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);
        const database = getDatabase(firebaseApp);
        
        // Make Firebase available globally
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseDatabase = database;
        window.firebaseApp = firebaseApp;
        
        console.log('Firebase initialized with Realtime Database');
    </script>

    
    <script type="module">
        // P1. Landing & Login logic with Firebase integration
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DOM loaded, initializing app...');
            
            const nicknameEl = document.getElementById('nickname');
            const pinEl = document.getElementById('pin');
            const startBtn = document.getElementById('startBtn');
            const demoBtn = document.getElementById('demoBtn');

            console.log('Elements found:', { nicknameEl, pinEl, startBtn, demoBtn });

            // Load app module
            let app;
            try {
                const appModule = await import('./js/app.js');
                app = appModule.default;
                console.log('App module loaded:', app);
                
                // Initialize Firebase
                await app.initializeFirebase();
                console.log('Firebase initialized, ready:', app.isFirebaseReady());
            } catch (error) {
                console.error('Failed to load app module:', error);
                return;
            }

            // Persistent auth: auto-redirect if user exists
            const existing = app.getUser();
            const activeRoom = app.getActiveRoom();
            if (existing?.userId && existing?.nickname) {
                window.location.href = activeRoom ? 'room.html' : 'lobby.html';
                return;
            }

            const validate = () => {
                const nickname = nicknameEl.value.trim();
                const pin = pinEl.value.trim();

                if (!nickname) {
                    app.showToast('Enter a nickname.');
                    nicknameEl.focus();
                    return null;
                }
                if (nickname.length > 8) {
                    app.showToast('Nickname must be 8 characters or less.');
                    nicknameEl.focus();
                    return null;
                }
                if (!/^[0-9]{4}$/.test(pin)) {
                    app.showToast('PIN must be 4 digits.');
                    pinEl.focus();
                    return null;
                }
                return { nickname, pin };
            };

            const handleLogin = async () => {
                console.log('handleLogin called');
                const payload = validate();
                if (!payload) return;

                try {
                    startBtn.disabled = true;
                    startBtn.textContent = 'Checking Account...';
                    console.log('Starting authentication process...');

                    // First, try to authenticate with existing credentials
                    const existingUser = await app.authenticateUser(payload);
                    
                    if (existingUser) {
                        console.log('✅ Existing user authenticated:', existingUser.nickname);
                        app.showToast(`Welcome back, ${existingUser.nickname}!`);
                        
                        // Check if they have an active room
                        const activeRoom = app.getActiveRoom();
                        window.location.href = activeRoom ? 'room.html' : 'lobby.html';
                        return;
                    }
                    
                    // No existing user found, create a new one
                    console.log('Creating new user account...');
                    startBtn.textContent = 'Creating Account...';
                    
                    const userId = app.generateId();
                    console.log('Generated user ID:', userId);
                    
                    const result = await app.saveUser({ 
                        userId,
                        nickname: payload.nickname,
                        pin: payload.pin
                    });
                    
                    console.log('User creation result:', result);

                    app.showToast(`Welcome, ${payload.nickname}`);
                    
                    console.log('Redirecting to lobby...');
                    setTimeout(() => {
                        window.location.href = 'lobby.html';
                    }, 500);
                } catch (error) {
                    console.error('❌ Login error:', error);
                    console.error('Error details:', {
                        message: error.message,
                        stack: error.stack
                    });
                    
                    // Show specific error message for nickname conflicts
                    if (error.message.includes('already taken')) {
                        app.showToast(error.message);
                        nickname.focus();
                        nickname.select();
                    } else {
                        app.showToast('Failed to create account. Please try again.');
                    }
                } finally {
                    startBtn.disabled = false;
                    startBtn.textContent = 'Get Started';
                    console.log('Login process completed (finally block)');
                }
            };

            const handleDemo = async () => {
                console.log('handleDemo called');
                try {
                    await app.saveUser({ userId: 'demo-user', nickname: 'Demo' });
                    app.showToast('Entering demo mode...');
                    setTimeout(() => window.location.href = 'lobby.html', 400);
                } catch (error) {
                    console.error('Demo error:', error);
                    app.showToast('Error entering demo mode.');
                }
            };

            // Add event listeners
            startBtn.addEventListener('click', handleLogin);
            pinEl.addEventListener('keyup', (e) => e.key === 'Enter' && handleLogin());
            nicknameEl.addEventListener('keyup', (e) => e.key === 'Enter' && handleLogin());
            demoBtn.addEventListener('click', handleDemo);

            console.log('Event listeners attached');
        });
    </script>
</body>
</html>
