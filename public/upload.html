<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Piggy Habit | Upload Proof</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">
    <main class="page">
        <header class="between flex">
            <div>
                <div class="muted">Verification</div>
                <div style="font-weight:800; font-size:22px;">Upload proof</div>
            </div>
            <button class="btn btn-outline btn-small" onclick="window.location.href='room.html'">Back</button>
        </header>

        <section class="card stack mt-24">
            <div class="muted" id="taskTitle">Selected task</div>
            <label class="btn btn-primary" style="text-align:center; cursor:pointer; width:100%;">
                <input type="file" accept="image/*" capture="environment" id="fileInput" style="display:none;">
                📸 Take/Choose Photo
            </label>
            
            <!-- Alternative button for mobile users having issues -->
            <button class="btn btn-outline" id="altFileBtn" style="width:100%; margin-top:8px;">
                🖼️ Try Alternative Upload
            </button>
            
            <div id="previewWrap" class="stack" style="display:none;">
                <div class="muted">Photo Preview</div>
                <img id="previewImg" alt="Preview" style="width:100%; border-radius: var(--radius-lg); border:1px solid var(--border);">
                
                <div class="input-group">
                    <label for="descriptionInput">Description (optional)</label>
                    <textarea id="descriptionInput" 
                             placeholder="Add a note about your progress..." 
                             style="min-height: 80px; resize: vertical;"
                             maxlength="300"></textarea>
                    <div class="muted" style="font-size: 12px; text-align: right;" id="charCount">0/300</div>
                </div>
                
                <button class="btn btn-primary" id="nextBtn">Submit Proof</button>
            </div>
        </section>
        

    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDA2c4ppqojUpSi090q7jyXSLR_8GTCXIw",
            authDomain: "hcd-piggy.firebaseapp.com",
            databaseURL: "https://hcd-piggy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hcd-piggy",
            messagingSenderId: "663289864346",
            appId: "1:663289864346:web:8eba034298e5681d7b3f23"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const database = getDatabase(app);
        
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseDatabase = database;
        window.firebaseApp = app;
    </script>
    
    <script type="module">
        document.addEventListener('DOMContentLoaded', async () => {
            // Load app module
            let app;
            try {
                const appModule = await import('./js/app.js');
                app = appModule.default;
                
                // Initialize Firebase
                await app.initializeFirebase();

            } catch (error) {

                return;
            }

            const user = app.requireUser();
            const proof = JSON.parse(localStorage.getItem('piggy-habit-proof') || '{}');
            
            // Check if we have the required data
            if (!proof.roomId) {
                app?.showToast('Error: No room selected. Please go back to the room and try again.');
                return;
            }
            
            const fileInput = document.getElementById('fileInput');
            const previewWrap = document.getElementById('previewWrap');
            const previewImg = document.getElementById('previewImg');
            const taskTitle = document.getElementById('taskTitle');
            const nextBtn = document.getElementById('nextBtn');
            const descriptionInput = document.getElementById('descriptionInput');
            const charCount = document.getElementById('charCount');

            if (taskTitle) {
                taskTitle.textContent = proof.task ? `${proof.task.label || 'Task'} · ${proof.task.desc || ''}` : 'Selected task';
            }            // Character counter for description
            descriptionInput?.addEventListener('input', (e) => {
                const count = e.target.value.length;
                if (charCount) {
                    charCount.textContent = `${count}/300`;
                    charCount.style.color = count > 280 ? '#FF3B30' : '';
                }
            });

            // Main file input handler
            fileInput?.addEventListener('change', (e) => {
                handleFileSelection(e.target.files[0]);
            });
            
            // Alternative file upload for mobile issues
            document.getElementById('altFileBtn')?.addEventListener('click', () => {
                // Create a new input element to ensure fresh state
                const newInput = document.createElement('input');
                newInput.type = 'file';
                newInput.accept = 'image/jpeg,image/jpg,image/png,image/webp';
                newInput.capture = 'environment';
                newInput.style.display = 'none';
                
                newInput.addEventListener('change', (e) => {
                    handleFileSelection(e.target.files[0]);
                });
                
                document.body.appendChild(newInput);
                newInput.click();
                setTimeout(() => document.body.removeChild(newInput), 1000);
            });
            
            // Centralized file handling function
            const handleFileSelection = (file) => {
                if (!file) {
                    return;
                }
                
                // Validate file type
                const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif'];
                if (!allowedTypes.includes(file.type)) {
                    app.showToast('Please select a valid image file (JPEG, PNG, WebP, or GIF)');
                    return;
                }
                
                // Check file size (limit to 8MB for better mobile compatibility)
                const maxSize = 8 * 1024 * 1024; // 8MB
                if (file.size > maxSize) {
                    app.showToast(`Image too large (${(file.size / 1024 / 1024).toFixed(1)}MB). Please choose a smaller image (max 8MB).`);
                    return;
                }
                
                // Store the file object for later upload
                window.selectedFile = file;
                
                // For mobile optimization, we'll compress the image if it's too large
                if (file.size > 2 * 1024 * 1024) { // If larger than 2MB
                    compressAndPreview(file);
                } else {
                    previewImage(file);
                }
            }
            
            // Image compression for mobile
            function compressAndPreview(file) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = () => {
                    // Calculate new dimensions (max 1200px width)
                    const maxWidth = 1200;
                    let { width, height } = img;
                    
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // Draw and compress
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    canvas.toBlob((compressedFile) => {
                        if (compressedFile) {
                            window.selectedFile = new File([compressedFile], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            });
                            previewImage(window.selectedFile);
                        } else {
                            previewImage(file); // Fallback to original
                        }
                    }, 'image/jpeg', 0.8); // 80% quality
                };
                
                img.onerror = () => {
                    previewImage(file); // Fallback to original
                };
                
                const reader = new FileReader();
                reader.onload = (e) => img.src = e.target.result;
                reader.onerror = () => previewImage(file); // Fallback
                reader.readAsDataURL(file);
            }
            
            // Preview the selected image
            function previewImage(file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    if (previewImg) {
                        previewImg.src = ev.target.result;
                        previewImg.onload = () => {

                            if (previewWrap) {
                                previewWrap.style.display = 'flex';
                            }
                        };
                        previewImg.onerror = () => {

                            app.showToast('Failed to preview image. You can still try to upload.');
                        };
                    }
                };
                reader.onerror = (error) => {

                    app.showToast('Failed to read image file. Please try a different photo.');
                };
                reader.readAsDataURL(file);
            }

            nextBtn?.addEventListener('click', async () => {

                if (!previewImg?.src) {
                    app.showToast('Please attach a photo.');
                    return;
                }
                
                if (!window.selectedFile) {
                    app.showToast('No photo file selected. Please try again.');
                    return;
                }
                
                try {
                    nextBtn.disabled = true;
                    nextBtn.textContent = 'Uploading...';
                    
                    const description = descriptionInput?.value?.trim() || '';


                    
                    // Get consistent user ID (Firebase UID if available, otherwise localStorage ID)
                    const currentUser = app.getCurrentUser();
                    const userId = currentUser?.uid || user.userId;

                    
                    const firebaseStatus = app.isFirebaseReady();

                    
                    if (!firebaseStatus || !firebaseStatus.isReady || !proof.roomId) {

                        app.showToast('Cannot submit: Please refresh and try again.');
                        return;
                    }
                    
                    // Upload image using Firebase Database (no Storage costs!)
                    let imageUrl = '';

                    
                    try {

                        nextBtn.textContent = 'Compressing image...';
                        
                        // Compress image for database storage
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const img = new Image();
                        
                        await new Promise((resolve, reject) => {
                            img.onload = resolve;
                            img.onerror = reject;
                            img.src = URL.createObjectURL(window.selectedFile);
                        });
                        
                        // Calculate optimal dimensions for database storage (target ~300KB max)
                        let { width, height } = img;
                        const maxWidth = 800;
                        const maxHeight = 600;
                        
                        if (width > maxWidth || height > maxHeight) {
                            const ratio = Math.min(maxWidth / width, maxHeight / height);
                            width *= ratio;
                            height *= ratio;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Convert to base64 with good compression
                        const base64 = canvas.toDataURL('image/jpeg', 0.75);
                        

                        
                        nextBtn.textContent = 'Uploading to database...';
                        
                        // Store in Firebase Database
                        const timestamp = Date.now();
                        const imageId = `${userId}_${timestamp}`;
                        
                        // Use the v9 Firebase Database syntax
                        const { ref, set, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js');
                        const imageRef = ref(window.firebaseDatabase, `tempImages/${imageId}`);
                        
                        await set(imageRef, {
                            data: base64,
                            filename: window.selectedFile.name,
                            uploadedAt: serverTimestamp(),
                            userId: userId
                        });
                        
                        imageUrl = `database:${imageId}`; // Special prefix to indicate database storage

                        
                    } catch (uploadError) {

                        app.showToast(`Failed to upload image: ${uploadError.message}`);
                        return;
                    }
                    
                    if (!imageUrl) {
                        app.showToast('Failed to upload image after multiple attempts. Please try again.');
                        return;
                    }
                    
                    // Save submission metadata to Firebase Database (much smaller now)
                    try {

                        nextBtn.textContent = 'Saving submission...';
                        
                        const submissionData = {
                            ...proof,
                            imageUrl: imageUrl, // Store URL instead of base64 data
                            description: description,
                            submittedAt: Date.now(),
                            submittedBy: user.nickname,
                            userId: userId,
                            status: 'pending',
                            approvals: [],
                            rejections: []
                        };
                        
                        const submissionId = `${userId}_${Date.now()}`;
                        const updateData = {
                            [`submissions/${submissionId}`]: submissionData
                        };
                        

                        await app.updateRoom(proof.roomId, updateData);

                        
                    } catch (firebaseError) {

                        app.showToast(`Firebase error: ${firebaseError.message}`);
                        return;
                    }
                    
                    // Clean up
                    localStorage.removeItem('piggy-habit-proof');
                    localStorage.removeItem('piggy-habit-proof-done');
                    localStorage.removeItem('piggy-habit-proof-img'); // Clean up any old image data
                    window.selectedFile = null;
                    
                    // Clear any cached redirects or state that might interfere
                    sessionStorage.removeItem('lastPage');
                    sessionStorage.removeItem('redirectAfterUpload');
                    localStorage.removeItem('pendingRedirect');
                    
                    // Set completion flags
                    window.uploadCompleted = true;
                    sessionStorage.setItem('uploadJustCompleted', 'true');
                    localStorage.setItem('uploadSuccess', Date.now().toString());
                    
                    // Clean up and set completion flags
                    window.uploadCompleted = true;
                    sessionStorage.setItem('uploadJustCompleted', 'true');
                    localStorage.setItem('uploadSuccess', Date.now().toString());
                    
                    // Block verify redirects for a short time
                    window.blockVerifyRedirect = true;
                    setTimeout(() => {
                        window.blockVerifyRedirect = false;
                    }, 5000);
                    
                    app.showToast('Proof submitted! Returning to room...');

                    
                    // Simple redirect to room
                    setTimeout(() => {
                        window.location.href = 'room.html#feed';
                    }, 1000);
                } catch (error) {
                    app.showToast(`Failed to submit proof: ${error.message}`);
                } finally {
                    nextBtn.disabled = false;
                    nextBtn.textContent = 'Submit Proof';
                }
            });
        });
    </script>
</body>
</html>
