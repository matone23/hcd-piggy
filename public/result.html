<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Piggy Habit | Result</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">
    <main class="page center">
        <!-- Loading state - shown initially -->
        <div id="loadingState" class="card stack">
            <div class="muted">Loading results...</div>
            <div style="text-align: center; padding: 20px;">
                <div style="font-size: 24px; animation: spin 1s linear infinite;">⏳</div>
            </div>
        </div>

        <!-- Content state - shown after loading -->
        <div id="contentState" style="display: none;">
            <div class="card stack">
                <h1 id="winnerTitle"></h1>
                <p id="winnerDesc"></p>
                <button id="rematchBtn" class="btn btn-primary">Rematch</button>
                <button class="btn btn-outline" onclick="window.location.href='lobby.html'">Back to Lobby</button>
            </div>
        </div>
    </main>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <div id="toast" role="status" aria-live="polite"></div>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDA2c4ppqojUpSi090q7jyXSLR_8GTCXIw",
            authDomain: "hcd-piggy.firebaseapp.com",
            databaseURL: "https://hcd-piggy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hcd-piggy",
            storageBucket: "hcd-piggy.firebasestorage.app",
            messagingSenderId: "663289864346",
            appId: "1:663289864346:web:8eba034298e5681d7b3f23"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const database = getDatabase(app);
        
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseDatabase = database;
        window.firebaseApp = app;
    </script>
    
    <script type="module">
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Result page DOM loaded');
            
            // Load app module
            let app;
            try {
                const appModule = await import('./js/app.js');
                app = appModule.default;
                
                // Initialize Firebase
                await app.initializeFirebase();
                console.log('Firebase ready in result:', app.isFirebaseReady());
            } catch (error) {
                console.error('Failed to load app module:', error);
                return;
            }

            const user = app.requireUser();
            const room = JSON.parse(localStorage.getItem('piggy-habit-room') || '{}');
            console.log('Result room data:', room);
            
            const loadingState = document.getElementById('loadingState');
            const contentState = document.getElementById('contentState');
            const winnerTitle = document.getElementById('winnerTitle');
            const winnerDesc = document.getElementById('winnerDesc');
            const rematchBtn = document.getElementById('rematchBtn');

            console.log('Elements found:', { winnerTitle, winnerDesc, rematchBtn });

            // Load complete winner data from Firebase
            let winnerData = null;
            let competitionData = null;
            
            if (app.isFirebaseReady() && room.id) {
                try {
                    console.log('🔍 Fetching competition data from Firebase for room:', room.id);
                    const firebaseRoom = await app.getRoom(room.id);
                    competitionData = firebaseRoom;
                    
                    if (firebaseRoom) {
                        console.log('📊 Firebase room data loaded');
                        
                        // Check if winner is already stored
                        if (firebaseRoom.winner) {
                            console.log('🏆 Using stored winner:', firebaseRoom.winner);
                            winnerData = firebaseRoom.winner;
                        } else {
                            // Calculate winner from current data
                            console.log('🔢 Calculating winner from competition data...');
                            winnerData = calculateWinner(firebaseRoom, firebaseRoom.mode);
                            
                            // Save calculated winner back to Firebase for future access (IoT, etc)
                            if (winnerData) {
                                console.log('💾 Saving calculated winner to Firebase...');
                                try {
                                    await app.updateRoom(room.id, { 
                                        winner: winnerData,
                                        winnerCalculatedAt: Date.now()
                                    });
                                    console.log('✅ Winner saved to Firebase');
                                } catch (error) {
                                    console.warn('⚠️ Failed to save winner to Firebase:', error);
                                }
                            }
                        }
                        
                        console.log('🎯 Final winner data:', winnerData);
                    }
                } catch (error) {
                    console.warn('❌ Failed to load room from Firebase:', error);
                }
            }
            
            // Function to calculate winner from room data
            function calculateWinner(roomData, mode = 'routine') {
                if (!roomData || !roomData.participants) {
                    console.warn('❌ Missing room data for winner calculation');
                    return null;
                }
                
                const participants = Object.values(roomData.participants);
                const submissions = roomData.submissions ? Object.values(roomData.submissions) : [];
                
                // Calculate score for each participant based on mode
                const participantScores = participants.map(participant => {
                    let score = 0;
                    let displayScore = 0;
                    
                    if (mode === 'oneday') {
                        // For oneday: calculate percentage of tasks completed on deadline day
                        const oneDayReferenceDate = new Date(roomData.dday).toDateString();
                        const userSubmissions = submissions.filter(sub => 
                            sub.userId === participant.userId && 
                            sub.status === 'approved' &&
                            new Date(sub.submittedAt).toDateString() === oneDayReferenceDate
                        );
                        
                        const tasksCompleted = userSubmissions.length;
                        const totalTasks = (participant.goals && participant.goals.length) ? participant.goals.length : 0;
                        score = totalTasks > 0 ? (tasksCompleted / totalTasks) * 100 : 0;
                        displayScore = Math.round(score);
                    } else {
                        // For routine: calculate points from approved submissions
                        const userSubmissions = submissions.filter(sub => 
                            sub.userId === participant.userId && sub.status === 'approved'
                        );
                        
                        score = userSubmissions.reduce((total, sub) => {
                            return total + (sub.task?.points || 10);
                        }, 0);
                        displayScore = score;
                    }
                    
                    return {
                        ...participant,
                        score,
                        displayScore,
                        submissionCount: submissions.filter(s => s.userId === participant.userId && s.status === 'approved').length
                    };
                });
                
                // Sort by score to find winner
                participantScores.sort((a, b) => b.score - a.score);
                
                const winner = participantScores[0];
                const hasCompetition = winner && winner.score > 0 && participantScores.some(p => p.score < winner.score);
                const isSingleParticipant = participantScores.length === 1;
                
                // Return winner if there's competition, or if they're the only participant
                if (hasCompetition || isSingleParticipant) {
                    console.log('🏆 Winner:', winner.nickname, 'with', winner.displayScore, mode === 'oneday' ? '%' : 'pts');
                    return {
                        nickname: winner.nickname,
                        userId: winner.userId,
                        points: winner.displayScore,
                        color: winner.color
                    };
                } else {
                    console.log('🤝 No clear winner (tie or no points)');
                    return null;
                }
            }
            
            // Display winner information
            if (winnerData && winnerData.nickname) {
                
                // Check if current user is the winner
                const userIsWinner = winnerData.userId === user.userId;
                
                if (winnerTitle) {
                    if (userIsWinner) {
                        winnerTitle.textContent = 'You won! 🎉';
                    } else {
                        winnerTitle.textContent = `${winnerData.nickname} wins!`;
                    }
                    
                    // Add winner's color as background accent
                    if (winnerData.color) {
                        winnerTitle.style.background = `linear-gradient(135deg, ${winnerData.color}dd, ${winnerData.color})`;
                        winnerTitle.style.color = '#fff';
                        winnerTitle.style.padding = '16px 24px';
                        winnerTitle.style.borderRadius = '12px';
                        winnerTitle.style.textShadow = '0 2px 4px rgba(0,0,0,0.4)';
                        winnerTitle.style.fontWeight = '800';
                        winnerTitle.style.fontSize = '24px';
                        winnerTitle.style.boxShadow = `0 4px 12px ${winnerData.color}44`;
                    }
                }
                
                if (winnerDesc) {
                    let message = '';
                    if (winnerData.points !== undefined) {
                        if (userIsWinner) {
                            // Winner sees their own achievement
                            if (competitionData?.mode === 'oneday') {
                                message = `🎉 Congratulations! You completed ${winnerData.points}% of the tasks.`;
                            } else {
                                message = `🎉 Congratulations! You earned ${winnerData.points} points.`;
                            }
                        } else {
                            // Non-winner sees the winner's achievement without "Congratulations"
                            if (competitionData?.mode === 'oneday') {
                                message = `${winnerData.nickname} completed ${winnerData.points}% of the tasks.`;
                            } else {
                                message = `${winnerData.nickname} earned ${winnerData.points} points.`;
                            }
                        }
                    } else {
                        message = 'Great effort!';
                    }
                    
                    // Add competitive/motivating call to action
                    const ctaMessage = userIsWinner 
                        ? ' Ready for another round? Challenge them again!' 
                        : ' Time for a rematch! Show them what you\'ve got!';
                    
                    winnerDesc.textContent = message + ctaMessage;
                }
            } else {
                // Fallback display
                console.log('🤝 No winner determined, showing default message');
                
                if (winnerTitle) {
                    winnerTitle.textContent = competitionData?.manuallyEnded ? 'Competition Complete!' : 'Great effort everyone!';
                }
                if (winnerDesc) {
                    winnerDesc.textContent = 'Everyone did their best! Set up a new challenge to continue.';
                }
            }

            // Display user's color with piggy bank message - only if user won
            const userIsWinner = winnerData && winnerData.userId === user.userId;
            
            console.log('🎉 User won this competition:', userIsWinner);

            // Hide loading state and show content
            loadingState.style.display = 'none';
            contentState.style.display = 'block';

            rematchBtn?.addEventListener('click', async () => {
                console.log('Rematch button clicked');
                
                try {
                    rematchBtn.disabled = true;
                    rematchBtn.textContent = 'Starting...';
                    
                    app.showToast('Starting rematch...');
                    
                    // Clear old competition data for fresh start
                    localStorage.removeItem('piggy-habit-room');
                    localStorage.removeItem('piggy-habit-proof-done');
                    
                    console.log('🗑️ Cleared old competition data for fresh start');
                    
                    setTimeout(() => {
                        window.location.href = 'create.html';
                    }, 400);
                } catch (error) {
                    console.error('Error starting rematch:', error);
                    app.showToast('Failed to start rematch. Please try again.');
                } finally {
                    rematchBtn.disabled = false;
                    rematchBtn.textContent = 'Rematch';
                }
            });
            
            console.log('Result page initialized successfully');
        });
    </script>
</body>
</html>
