<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Confirm Upload</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 사진 미리보기용 스타일 */
        .photo-preview {
            width: 100%;
            height: 60vh;
            background-color: #333;
            background-image: url('https://via.placeholder.com/400x600?text=Your+Photo'); 
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container" style="background-color: #000;">
        
        <div class="photo-preview"></div>

        <div style="background: white; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;">
            <h2 style="margin-bottom: 8px;">이 사진으로 인증할까요?</h2>
            <p style="margin-bottom: 24px;">Max(10점)을 획득합니다.</p>
            
            <button class="btn btn-primary" style="margin-bottom: 12px;" onclick="location.href='home.html'">인증 완료하고 점수 받기</button>
            <button class="btn btn-secondary" onclick="history.back()">다시 찍기</button>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
