<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify Friend</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div style="margin-bottom: 24px;">
            <a href="home.html" style="text-decoration: none; color: var(--text-sub); font-size: 14px;">&lt; 닫기</a>
            <h2 style="margin-top: 8px;">인증 피드백</h2>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 16px; border-bottom: 1px solid #eee;">
                <span style="font-weight: 700;">민준님의 인증</span>
                <span style="color: var(--text-sub); font-size: 13px; float: right;">10분 전</span>
            </div>
            
            <div style="width: 100%; height: 300px; background: #eee; display: flex; align-items: center; justify-content: center;">
                <span style="color: #aaa;">(친구의 사진)</span>
            </div>

            <div style="padding: 16px; display: flex; gap: 10px;">
                <button class="btn btn-primary" style="flex: 1; height: 44px; font-size: 14px;">👍 인정합니다</button>
                <button class="btn btn-secondary" style="flex: 1; height: 44px; font-size: 14px; color: var(--danger);">🙅‍♀️ 의심스러워요</button>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <p style="font-size: 13px; margin-bottom: 8px;">• 지수님이 이 인증을 인정했습니다.</p>
            <p style="font-size: 13px; margin-bottom: 8px;">• 예영님이 확인 중...</p>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
