<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div style="margin-bottom: 24px;">
            <a href="home.html" style="text-decoration: none; color: var(--text-sub); font-size: 14px;">&lt; 닫기</a>
            <h2>내 기기 설정</h2>
        </div>

        <div class="card" style="display: flex; align-items: center;">
            <div style="width: 12px; height: 12px; border-radius: 50%; background: var(--success); margin-right: 10px;"></div>
            <span style="font-weight: 600;">기기 연결됨 (Online)</span>
        </div>

        <div class="card">
            <h3 style="font-size: 16px; margin-bottom: 12px;">저금통 와이파이 설정</h3>
            <input type="text" class="input-field" placeholder="SSID (와이파이 이름)">
            <input type="password" class="input-field" placeholder="비밀번호">
            <button class="btn btn-secondary" style="height: 44px; font-size: 14px;">기기로 전송</button>
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <a href="index.html" style="color: var(--text-sub); text-decoration: underline; font-size: 13px;">로그아웃</a>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
